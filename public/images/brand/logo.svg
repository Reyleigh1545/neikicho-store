<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="nekichoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39ABD"/>
      <stop offset="50%" stop-color="#E33D7D"/>
      <stop offset="100%" stop-color="#A51F5E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E33D7D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Gift Box + Cat Ears Motif (NekiCho) -->
  <g transform="translate(10, 14)">
    <!-- Cat Ears on the Gift Box -->
    <path d="M12 18 L20 4 L26 18 Z" fill="#E33D7D"/>
    <path d="M15 17 L20 8 L24 17 Z" fill="#F39ABD"/>
    
    <path d="M34 18 L40 4 L48 18 Z" fill="#E33D7D"/>
    <path d="M36 17 L40 8 L45 17 Z" fill="#F39ABD"/>

    <!-- Main Gift Box Base -->
    <rect x="8" y="24" width="44" height="28" rx="6" fill="url(#nekichoPink)" filter="url(#glow)"/>
    
    <!-- Gift Box Lid -->
    <rect x="6" y="18" width="48" height="9" rx="3" fill="#A51F5E"/>
    
    <!-- Ribbon Vertical -->
    <rect x="26" y="18" width="8" height="34" fill="#FFF3F7"/>
    
    <!-- Ribbon Bow -->
    <circle cx="30" cy="18" r="4" fill="#FFF3F7"/>
    <path d="M26 17 C20 12, 20 6, 27 15 Z" fill="#F39ABD"/>
    <path d="M34 17 C40 12, 40 6, 33 15 Z" fill="#F39ABD"/>
    
    <!-- Cute Blush Marks -->
    <ellipse cx="18" cy="38" rx="3" ry="1.5" fill="#FFF3F7" fill-opacity="0.6"/>
    <ellipse cx="42" cy="38" rx="3" ry="1.5" fill="#FFF3F7" fill-opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="74" y="47" font-family="'Nunito', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#3B1828">
    Neki<tspan fill="url(#nekichoPink)">Cho</tspan>
  </text>

  <!-- Sweet Tagline / University Concept -->
  <text x="76" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="2.5" fill="#8C5870">
    HANDCRAFTED GIFTS &amp; BOXES
  </text>
  
  <!-- Tiny decorative star -->
  <path d="M258 24 Q261 28 266 29 Q261 30 258 34 Q257 30 252 29 Q257 28 258 24 Z" fill="#F39ABD"/>
</svg>

